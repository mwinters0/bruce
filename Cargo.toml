[package]
name = "bruce"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A link checker that validates anchors and keeps a link graph with run history"
publish = false

[dependencies]
duckdb = { version = "1.10506.1", features = ["bundled"] }
globset = "0.4.20"
htmlize = { version = "1.1.0", features = ["unescape_fast"] }
lol_html = "3.0.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
url = "2.5.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
tempfile = "3.27.0"

# `harness = false` because criterion has its own; `test = true` so `cargo
# test` and nextest run it once in criterion's test mode (D24).
[[bench]]
name = "extract"
harness = false
test = true
