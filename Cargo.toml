[package]
name = "bruce"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "A link checker that validates anchors and keeps a link graph with run history"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The builder alone, no colour or suggestions: already in criterion's tree.
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
duckdb = { version = "1.10506.1", features = ["bundled"] }
encoding_rs = "0.8.42"
# Sitemaps served as `.xml.gz` files; already in reqwest's tree.
flate2 = "1.1.10"
globset = "0.4.20"
hickory-resolver = "0.26.3"
htmlize = { version = "1.1.0", features = ["unescape_fast"] }
httpdate = { version = "1.0.3", default-features = false }
hyper = { version = "1.12.0", default-features = false }
lol_html = "3.0.1"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
# rustls without a provider (ring is installed in `fetch::http`) and hickory
# DNS: D45.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "deflate", "hickory-dns"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
texting_robots = "0.2.2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
url = "2.5.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["net", "io-util"] }
wiremock = "0.6.5"

# `harness = false` because criterion has its own; `test = true` so `cargo
# test` and nextest run it once in criterion's test mode (D24).
[[bench]]
name = "extract"
harness = false
test = true
