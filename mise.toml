[tools]
# Every tool is pinned exactly: under `latest`, two runs of one commit could
# check under different versions (D23).
#
# `cargo nextest run` runs the suite once there is one (`scripts/check.py`),
# one test a CPU, nextest's default: no thread cap is committed, a fixed count
# being wrong on every other checkout, and a machine needing one sets
# `NEXTEST_TEST_THREADS`.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
# `mise run check` and every `scripts/*.py`.
uv = "0.12.17"
# The toolchain `bruce` builds with; `rust-version` in `Cargo.toml` is its
# minor. rust-analyzer is the one `scripts/module_graph.py` indexes with.
rust = { version = "1.99.1", components = "clippy,rustfmt,rust-analyzer" }

# Every per-round check once, logged under `runs/check/`; `--verify` reuses a
# passing run of the same tree. `scripts/check.py` says what it runs and why.
[tasks.check]
description = "Run the per-round checks once and summarize them"
dir = "{{config_root}}/scripts"
run = "uv run check.py"

# The cargo commands one at a time; `check` runs fmt, clippy and test among
# the rest, each with the flags it holds a round to.
[tasks.build]
description = "Build bruce"
run = "cargo build"

[tasks.test]
description = "Run the test suite under nextest"
run = "cargo nextest run"

[tasks.clippy]
description = "Lint every target, warnings included"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
description = "Format the crate"
run = "cargo fmt"

[tasks.bench]
description = "Run the criterion benches"
run = "cargo bench"
