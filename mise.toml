[tools]
# Every tool is pinned exactly: under `latest`, two runs of one commit could
# check under different versions (D23).
#
# `cargo nextest run` runs the suite once there is one (`scripts/check.py`),
# one test a CPU, nextest's default: no thread cap is committed, a fixed count
# being wrong on every other checkout, and a machine needing one sets
# `NEXTEST_TEST_THREADS`.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
# `mise run check` and every `scripts/*.py`.
uv = "0.12.17"
# The toolchain `bruce` builds with; `rust-version` in `Cargo.toml` is its
# minor. rust-analyzer is the one `scripts/module_graph.py` indexes with.
rust = { version = "1.99.1", components = "clippy,rustfmt,rust-analyzer" }
# Runs the Antora that `mise run e2e` builds its test site with (D24); the
# Antora version is pinned in `scripts/e2e.py`.
node = "24.21.0"
# `mise run shot` renders an HTML page headless with servoshell (`scripts/shot.py`),
# and DejaVu is the one font a machine with none installed then has.
"github:servo/servo" = "0.7.0"
"github:dejavu-fonts/dejavu-fonts" = { version = "2_37", asset_pattern = "dejavu-fonts-ttf-*.tar.bz2", version_prefix = "version_" }

# Every per-round check once, logged under `runs/check/`; `--verify` reuses a
# passing run of the same tree. `scripts/check.py` says what it runs and why.
[tasks.check]
description = "Run the per-round checks once and summarize them"
dir = "{{config_root}}/scripts"
run = "uv run check.py"

# The simulated deployment: the deployment guide's tagged blocks extracted
# into the gitignored `sim/`, and its config checked to load (D42). The crawl
# is `mise run crawl`, below; `scripts/sim.py` says why it is not this.
[tasks.sim]
description = "Extract the deployment guide into sim/ and check its config loads"
dir = "{{config_root}}/scripts"
run = "uv run sim.py"

# The end-to-end Antora site, built whole and in part, and `check-dir` run on it (D24). It needs node and
# the network on the first run and is slow, so `check` runs it only when the
# `bruce` binary is affected (`scripts/check.py`).
[tasks.e2e]
description = "Build the fixture Antora site whole and in part, and gate it"
dir = "{{config_root}}/scripts"
run = "uv run e2e.py"

# An HTML page rendered headless, at a desktop's and a phone's width and with
# its print rules applied, to PNGs under `runs/shot/` for a person to read; it
# is no check (`scripts/shot.py`). `mise run shot PAGE` renders another page.
[tasks.shot]
description = "Render the digest's HTML headless with Servo to PNGs under runs/shot/"
dir = "{{config_root}}/scripts"
run = "uv run shot.py"

# The en-US crawl a review reads, into a copy of the last one's database so
# the digest compares two runs: `crawl` launches it detached and returns,
# `digest` writes its digest once it has finished, `serve` serves that on port
# 8086 (`scripts/review.py`). `digest` and `serve` take a `runs/` directory.
[tasks.crawl]
description = "Launch an en-US crawl detached, into a copy of the last crawl's database"
dir = "{{config_root}}/scripts"
run = "uv run review.py crawl"

[tasks.digest]
description = "Write the digest of the newest review crawl, once it has finished"
dir = "{{config_root}}/scripts"
run = "uv run review.py digest"

[tasks.serve]
description = "Serve the newest review crawl's digest on port 8086"
dir = "{{config_root}}/scripts"
run = "uv run review.py serve"

# The cargo commands one at a time; `check` runs fmt, clippy and test among
# the rest, each with the flags it holds a round to.
[tasks.build]
description = "Build bruce"
run = "cargo build"

[tasks.test]
description = "Run the test suite under nextest"
run = "cargo nextest run"

[tasks.clippy]
description = "Lint every target, warnings included"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
description = "Format the crate"
run = "cargo fmt"

[tasks.bench]
description = "Run the criterion benches"
run = "cargo bench"
