# A release: the binary built from a `v*` tag in a Debian Trixie container, so
# its glibc floor is Trixie's (D23), archived with the notices and licenses,
# and published on GitHub. No step uses an action (`roadmap.md`, "Standing
# rules"): each is a command in the container, and `scripts/workflows.py`
# fails on a `uses:`. `uv run workflows.py script release.yml` prints the steps
# as one shell script, to run in a `debian:trixie` container by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl gh git

      - name: Check out the tag
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $auth" clone --depth 1 \
            --branch "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src
          # A tag moved after the push is not the commit this run was started for.
          test "$(git -C src rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check the tag against the crate
        working-directory: src
        run: |
          case $GITHUB_REF_NAME in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "$GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre>]"; exit 1 ;;
          esac
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          base=${GITHUB_REF_NAME#v}
          base=${base%%-*}
          if [ "$base" != "$crate" ]; then
            echo "$GITHUB_REF_NAME is not a release of Cargo.toml's $crate"
            exit 1
          fi

      - name: Install the pinned Rust
        working-directory: src
        run: |
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)
          test -n "$rust"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain "$rust"

      - name: Build
        working-directory: src
        run: |
          . "$HOME/.cargo/env"
          # libstdc++ and libgcc_s are linked in (D23): rustc names both as
          # dynamic libraries, so a directory holding only the static ones
          # (libgcc_s as a script for libgcc_eh and libgcc) is searched first.
          libs=$PWD/target/static-libs
          mkdir -p "$libs"
          ln -sf "$(g++ -print-file-name=libstdc++.a)" "$libs/libstdc++.a"
          echo 'INPUT(-lgcc_eh -lgcc)' > "$libs/libgcc_s.a"
          RUSTFLAGS="-L native=$libs" cargo build --release --locked
          bin=target/release/bruce
          "$bin" --version
          # The floor D23 promises: no symbol newer than Trixie's glibc, 2.41.
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "newest glibc symbol: $newest"
          ldd "$bin"
          if ldd "$bin" | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "$bin links libstdc++ or libgcc_s dynamically"
            exit 1
          fi
          test "$(printf '%s\n' GLIBC_2.41 "$newest" | sort -V | tail -n 1)" = GLIBC_2.41

      - name: Archive
        working-directory: src
        run: |
          name=bruce-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu
          mkdir -p "dist/$name"
          cp target/release/bruce THIRD-PARTY-NOTICES.txt LICENSE-MIT LICENSE-APACHE "dist/$name/"
          epoch=$(git log -1 --format=%ct)
          cd dist
          # The same tree archives to the same bytes.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$epoch" -cf - "$name" |
            gzip -n -9 > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          tar -tzf "$name.tar.gz"

      # Releases are immutable once published, so the draft carries both assets
      # before it is published. The draft is made, filled and published by the
      # id its create call returns; no release is listed to find it.
      - name: Publish
        working-directory: src/dist
        run: |
          export GH_REPO=$GITHUB_REPOSITORY
          repo=repos/$GITHUB_REPOSITORY/releases
          name=bruce-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu
          case $GITHUB_REF_NAME in *-*) pre=true ;; *) pre=false ;; esac
          # A draft an earlier failed run left is removed. The list can be
          # stale, so one it misses stays, harmless, and each id is logged.
          gh api --paginate "$repo" \
            --jq '.[] | select(.draft and .tag_name == env.GITHUB_REF_NAME) | .id' |
            while read -r old; do
              echo "stale draft $old"
              gh api -X DELETE "$repo/$old" || echo "could not delete draft $old"
            done
          id=$(gh api -X POST "$repo" --jq .id \
            -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
            -f body="A 0.x release migrates no database: a schema change is named here, and the new binary starts a new one." \
            -F draft=true -F prerelease=$pre -F generate_release_notes=true)
          echo "draft $id"
          test -n "$id"
          for f in "$name.tar.gz" "$name.tar.gz.sha256"; do
            case $f in *.gz) type=application/gzip ;; *) type=text/plain ;; esac
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: $type" --data-binary "@$f" \
              "https://uploads.github.com/$repo/$id/assets?name=$f"
            echo
          done
          assets=$(gh api "$repo/$id" --jq '[.assets[].name] | sort | join(" ")')
          echo "draft $id holds: $assets"
          test "$assets" = "$name.tar.gz $name.tar.gz.sha256"
          gh api -X PATCH "$repo/$id" -F draft=false \
            --jq '"published \(.html_url) prerelease=\(.prerelease)"'
